apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 92.13.0
    chart: kube-prometheus-stack
    helm:
      values: |
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alert-agent-secrets
          config:
            route:
              receiver: "null"
              routes:
                - receiver: alert-agent
                  continue: true
                  group_by: ["namespace", "alertname"]
                  matchers:
                    - severity=~"warning|critical"
            receivers:
              - name: "null"
              - name: alert-agent
                webhook_configs:
                  - url: http://alert-agent.monitoring.svc.cluster.local/alert
                    send_resolved: false
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/alert-agent-secrets/WEBHOOK_TOKEN
        grafana:
          enabled: true
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.logging.svc.cluster.local
              isDefault: false
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo.tracing.svc.cluster.local:3200
              isDefault: false
        prometheus:
          prometheusSpec:
            scrapeInterval: 30s
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-stack-grafana
      jsonPointers:
        - /data/admin-password
        - data/admin-user
